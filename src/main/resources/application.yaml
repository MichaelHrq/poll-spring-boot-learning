spring:
  application:
    name: learning
  mongodb:
    uri: ${MONGO_URI}

jwt:
  expiration:
    access: ${JWT_ACCESS_EXPIRATION:900000}
    refresh: ${JWT_REFRESH_EXPIRATION:604800000}
  key: {JWT_KEY}

logging:
  level:
    root: INFO
    com.michael.learning: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG